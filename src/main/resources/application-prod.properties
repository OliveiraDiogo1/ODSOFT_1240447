server.port=8080

spring.datasource.url=jdbc:h2:file:${DATA_DIR:/data}/lms-prod;AUTO_SERVER=TRUE;IGNORECASE=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

file.upload-dir=${DATA_DIR:/data}/uploads
logging.level.root=INFO

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.private.key=${JWT_PRIVATE_KEY:classpath:rsa.private.key}
jwt.public.key=${JWT_PUBLIC_KEY:classpath:rsa.public.key}
